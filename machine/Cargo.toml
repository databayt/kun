# machine — Kun's desktop shell. Shell only: every feature's Rust lives beside its
# content.tsx in src/components/machine/<feature>/rust.rs and is wired in by build.rs.
[package]
name = "machine"
version = "0.1.0"
description = "Kun on every teammate's computer — catalog, chat, voice, dispatch"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "machine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
sha2 = "0.11"
walkdir = "2"
dirs = "6"
# machine profiles: per-login secrets in the OS store (Keychain / Credential Manager), never in JS.
keyring = "4.2"
# voice (cargo feature `voice`): local speech-to-text. whisper-rs builds whisper.cpp with
# cmake; a builder without cmake uses `--no-default-features` and gets a "not built" message.
whisper-rs = { version = "=0.16.0", optional = true }
# reqwest: the network feature talks to kun.databayt.org; voice reuses it for model downloads.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
# free disk space, portable (network health check).
fs4 = { version = "1.1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# skill links without admin rights: symlink_dir, then a directory junction, then a copy.
junction = "=2.1.0"

[features]
default = ["voice"]
voice = ["dep:whisper-rs"]

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
