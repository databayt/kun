<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 230' width='820' height='230' role='img' aria-label='Each 15 by 5 cm board is ripped in two and planed to 6.5 by 4 cm strips'><title>Each 15 by 5 cm board is ripped in two and planed to 6.5 by 4 cm strips</title><rect width='820' height='230' rx='14' fill='#f7f7f4'/><text x='30.0' y='34.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='14' font-weight='600' fill='#2b3035' text-anchor='start'>One board in, two strips out — 7 boards give 14 strips: use 12, keep 2 spare</text><rect x='40.0' y='70.0' width='135.0' height='45.0' rx='0' fill='#d6ad73' stroke='#2b3035' stroke-width='1'/><text x='107.5' y='137.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>board 15 × 5 cm</text><text x='205.0' y='96.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='22' font-weight='400' fill='#2e6a4e' text-anchor='middle'>→</text><rect x='235.0' y='70.0' width='64.8' height='45.0' rx='0' fill='#d6ad73' stroke='#2b3035' stroke-width='1'/><rect x='305.2' y='70.0' width='64.8' height='45.0' rx='0' fill='#d6ad73' stroke='#2b3035' stroke-width='1'/><line x1='302.5' y1='60.0' x2='302.5' y2='125.0' stroke='#c0392b' stroke-width='1.5' stroke-dasharray='5 3'/><text x='302.5' y='137.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>rip down the middle</text><text x='400.0' y='96.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='22' font-weight='400' fill='#2e6a4e' text-anchor='middle'>→</text><rect x='430.0' y='74.5' width='58.5' height='36.0' rx='0' fill='#e7c99c' stroke='#2b3035' stroke-width='1'/><rect x='497.5' y='74.5' width='58.5' height='36.0' rx='0' fill='#e7c99c' stroke='#2b3035' stroke-width='1'/><line x1='430.0' y1='129.0' x2='488.5' y2='129.0' stroke='#6b7280' stroke-width='1.2'/><line x1='430.0' y1='123.0' x2='430.0' y2='135.0' stroke='#6b7280' stroke-width='1.2'/><line x1='488.5' y1='123.0' x2='488.5' y2='135.0' stroke='#6b7280' stroke-width='1.2'/><text x='459.2' y='147.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>6.5 cm</text><line x1='574.0' y1='74.5' x2='574.0' y2='110.5' stroke='#6b7280' stroke-width='1.2'/><line x1='568.0' y1='74.5' x2='580.0' y2='74.5' stroke='#6b7280' stroke-width='1.2'/><line x1='568.0' y1='110.5' x2='580.0' y2='110.5' stroke='#6b7280' stroke-width='1.2'/><text x='584.0' y='96.5' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>4 cm</text><text x='493.0' y='56.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='12' font-weight='400' fill='#6b7280' text-anchor='middle'>planed all 4 faces</text><text x='30.0' y='200.0' font-family='IBM Plex Mono,ui-monospace,Menlo,monospace' font-size='13' font-weight='400' fill='#6b7280' text-anchor='start'>Ask the yard to keep each pair together and mark the top face with chalk.</text></svg>