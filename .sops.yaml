# sops + age: private org memory is encrypted at rest in this PUBLIC repo.
# Tooling: .claude/scripts/memory/memory.mjs   Docs: .claude/memory/facts/README.md
#
# Recipients are a comma-separated age public-key list (one line, so tooling can edit it).
# Add a teammate:  node .claude/scripts/memory/memory.mjs add-recipient <age1...>
# (enrolment process: .claude/memory/facts/README.md -> "Enrol a teammate").
#
# Everything under .claude/memory/private/ is stored as <name>.enc (sops binary mode: the whole
# file becomes one ciphertext, so key names and structure never leak either).
creation_rules:
  - path_regex: '^\.claude/memory/private/.*\.enc$'
    age: "age1p73ftm2gwvkpxgve74cgwtyz4w79kd5uh8hueuhjcur2smmxpq0qpm8vy6"
